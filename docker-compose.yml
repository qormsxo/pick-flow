# pick-flow 인프라.
# Redis 는 Vector Search(RediSearch)가 필요해서 redis-stack 을 쓴다.
# 공식 redis:7 이미지에는 FT.SEARCH / FT.CREATE 가 없다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pickflow
      POSTGRES_PASSWORD: pickflow
      POSTGRES_DB: pickflow
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pickflow -d pickflow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:7.4.0-v1
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
